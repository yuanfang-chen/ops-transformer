# test_soc_config.yaml
#
# 用来配置 CI 如何根据文件变更列表获取对应的芯片型号

global_config:
  module: True
  src:
    - global_config.cpp # ci不允许屏蔽完后没有文件，暂时先放一个不影响的文件在这
  ut_cov_exclude:
    - "*/tests/*"
    - "*/third_party/*"
    - "*/gtest/*"
    - "*/json/*"
    - build
    - common
    - mc2/3rd
    - mc2/common
    - attention/common/op_kernel

