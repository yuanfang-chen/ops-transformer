name: pre-commit

# Iteration loop on the self-hosted yf2 runner (Ascend 910B4, aarch64, CANN 9.0.0.beta2).
# Manual only: trigger via `gh workflow run pre-commit.yml --ref <branch>` with the
# inputs below. Push / PR triggers were removed intentionally — the runner is a
# single self-hosted box and we don't want every branch push to queue on it.

on:
  workflow_dispatch:
    inputs:
      op:
        description: Operator name (see <family>/<op> or experimental/<class>/<op>)
        required: false
        default: fused_infer_attention_score
        type: string
      soc:
        description: SoC target
        required: false
        default: ascend910b
        type: choice
        options:
          - ascend910b
          - ascend950
      gates:
        description: "Gates to run (subset of: compile,ut,pytest,st). Empty = all."
        required: false
        default: compile,ut
        type: string
      strict:
        description: Treat SKIPs as failures
        required: false
        default: false
        type: boolean

concurrency:
  # Shared across batch.yml, pre-commit.yml, and test-drive.yml because all
  # three mutate the same container workspace via test_runner. Queue serially
  # rather than risk a `git reset --hard` from one run yanking the tree out
  # from under another. Never cancel mid-run — a long batch should not be
  # killed by a quick pre-commit dispatch.
  group: runner-singleton
  cancel-in-progress: false

defaults:
  run:
    # `bash -l` so /etc/profile sources the CANN set_env.sh that the devcontainer
    # Dockerfile appends. Every step gets ASCEND_HOME_PATH, LD_LIBRARY_PATH, etc.
    shell: bash -el {0}

jobs:
  pre-commit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      OP: ${{ inputs.op || 'fused_infer_attention_score' }}
      SOC: ${{ inputs.soc || 'ascend910b' }}
      GATES: ${{ inputs.gates || 'compile,ut' }}
      STRICT_FLAG: ${{ inputs.strict && '--strict' || '' }}
      JOBS: '64'
      FORCE_COLOR: '1'
      # Point Node-based actions (checkout, upload-artifact, etc.) at the
      # system CA bundle so they trust the corporate TLS-intercepting proxy.
      # Does NOT affect the runner agent's own step-log uploads — those go
      # through .NET and use the OS trust store directly.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      # No actions/checkout — all work runs on the container via test_runner
      # (scripts live at /workspace/Src/ops-transformer inside the container).
      # Nothing here references $GITHUB_WORKSPACE. Skipping checkout dodges
      # the gateway's flaky gnutls TLS handshake against github.com.

      - name: normalize gates
        # Empty GATES means "all"; expand to the full set so the per-gate
        # `if: contains(...)` checks below are exact-token matches.
        run: |
          g="${GATES}"
          [ -z "$g" ] && g=compile,ut,pytest,st
          echo "GATES_NORM=$g" >> "$GITHUB_ENV"

      - name: prepare container TLS trust
        # The container's Huawei CAs are dropped as hash symlinks in
        # /etc/ssl/certs/ (so OpenSSL-linked tools trust them) but are NOT
        # in /etc/ssl/certs/ca-certificates.crt — the bundle that GnuTLS
        # (git's TLS backend) actually reads. Rebuild the bundle the first
        # time we see a container without Huawei in it, pin git at the
        # bundle, and force HTTP/1.1 (the corp proxy mishandles HTTP/2
        # ALPN for some hosts — manifests as curl exit 35 / intermittent
        # handshake failures). Idempotent: the grep check short-circuits
        # on subsequent runs for the bundle install; the http.version
        # pin is cheap to re-apply so we always set it.
        run: |
          source ~/test_runner.bash
          if test_runner bash -c "openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -q 'Huawei Web Secure'"; then
            echo "container TLS trust already includes Huawei CA — skipping bundle install"
          else
            echo "installing Huawei CA into container bundle"
            test_runner update-ca-certificates --fresh
            test_runner git config --system http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi
          test_runner git config --system http.version HTTP/1.1
          test_runner git config --system http.postBuffer 524288000
          test_runner git config --system http.lowSpeedLimit 1000
          test_runner git config --system http.lowSpeedTime 30
          echo "done"

      - name: sync real runner to test SHA
        # The container's workspace (/workspace/Src/ops-transformer) is an
        # independent git clone, not a bind-mount of the gateway's checkout.
        # Fetch the exact commit under CI from origin (GitHub) and hard-reset
        # to it so gates run against the PR's code, not whatever stale state
        # the container happens to be in. Untracked files (build/, ccache)
        # are preserved so incremental builds stay warm.
        #
        # Retry the fetch because the corporate TLS-intercepting proxy still
        # flakes ~30% of handshakes even with the CA installed (cluster-level
        # backend issues, outside our control). 5 attempts with exponential
        # + jitter backoff spreads retries across different proxy instances.
        # Probability of 5 consecutive failures at 30% each ≈ 0.24%.
        run: |
          source ~/test_runner.bash
          for attempt in 1 2 3 4 5; do
            if test_runner git fetch --force --prune origin "${GITHUB_REF}"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "git fetch failed after 5 attempts"
              exit 1
            fi
            # Exponential base (5, 10, 20, 40s) + up to 100% jitter
            base=$((5 * (2 ** (attempt - 1))))
            jitter=$((RANDOM % base))
            delay=$((base + jitter))
            echo "git fetch failed (attempt $attempt); sleeping ${delay}s before retry"
            sleep "$delay"
          done
          test_runner git reset --hard "${GITHUB_SHA}"
          test_runner git log -1 --oneline

      - name: show environment
        # The gateway runner only orchestrates; the real build/test box is a
        # docker container reached via the `test_runner` bash function, which
        # lives in ~/test_runner.bash on the gateway.
        run: |
          source ~/test_runner.bash
          echo "op=${OP}  soc=${SOC}  gates=${GATES_NORM}  strict=${STRICT_FLAG:-(off)}"
          echo "--- gateway ---"
          uname -a
          echo "--- real runner ---"
          test_runner bash -lc 'uname -a; echo "cores: $(nproc)"; echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH:-unset}"; python3 --version; ccache --version | head -1 || true'

      # One step per gate so each gate's log is readable via the GH API the
      # moment that gate finishes — the old single-step design kept every
      # gate's output hidden until the whole script exited.
      #
      # Each gate runs under `stdbuf -oL -eL` (on the real runner, inside the
      # test_runner call) so the LD_PRELOAD it installs propagates to every
      # descendant (bash → cmake → make → compilers), forcing line-buffered
      # stdio instead of libc's default 4 KB block buffering on pipes. Without
      # this, output arrives in bursts and the GH live log appears stalled
      # mid-compile.
      - name: compile
        if: contains(format(',{0},', env.GATES_NORM), ',compile,')
        run: |
          source ~/test_runner.bash
          test_runner env JOBS="${JOBS}" FORCE_COLOR="${FORCE_COLOR}" stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=compile ${STRICT_FLAG}

      - name: prepare python env for ut
        # op_kernel UT build runs scripts/util/gen_tiling_head_file.py, which
        # imports tbe → tvm → numpy. The container's Python is minimal, so
        # install the root requirements.txt (pyyaml, numpy, decorator, sympy,
        # scipy, attrs, protobuf, psutil) before the UT gate runs. Idempotent
        # — pip is a no-op when everything is already satisfied. Retry on
        # flakes, same pattern as the git fetch step.
        if: contains(format(',{0},', env.GATES_NORM), ',ut,')
        run: |
          source ~/test_runner.bash
          for attempt in 1 2 3; do
            if test_runner pip3 install -r requirements.txt; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "pip3 install failed after 3 attempts"
              exit 1
            fi
            delay=$((10 * attempt))
            echo "pip3 install failed (attempt $attempt); sleeping ${delay}s before retry"
            sleep "$delay"
          done

      - name: ut
        if: contains(format(',{0},', env.GATES_NORM), ',ut,')
        run: |
          source ~/test_runner.bash
          test_runner env JOBS="${JOBS}" FORCE_COLOR="${FORCE_COLOR}" stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=ut ${STRICT_FLAG}

      - name: pytest
        if: contains(format(',{0},', env.GATES_NORM), ',pytest,')
        run: |
          source ~/test_runner.bash
          test_runner env JOBS="${JOBS}" FORCE_COLOR="${FORCE_COLOR}" stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=pytest ${STRICT_FLAG}

      - name: st
        if: contains(format(',{0},', env.GATES_NORM), ',st,')
        run: |
          source ~/test_runner.bash
          test_runner env JOBS="${JOBS}" FORCE_COLOR="${FORCE_COLOR}" stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=st ${STRICT_FLAG}

      - name: fetch logs from real runner
        # Gates write logs under build/precommit on the container; pull them
        # back via test_runner. The command form of test_runner no longer
        # allocates a PTY, so binary tar output passes through cleanly.
        if: always()
        continue-on-error: true
        run: |
          source ~/test_runner.bash
          mkdir -p build/precommit
          test_runner tar -C build/precommit -cf - . 2>/dev/null \
            | tar -C build/precommit -xf - || true
          ls -la build/precommit/ || true

      - name: print log tails
        # Embed each gate's log tail into the live job log via collapsible
        # ::group:: blocks. The gate step's own stdout already streams the
        # full session live (stdbuf -oL on the remote side), so this is
        # belt-and-suspenders — it captures whatever pre_commit_check.py
        # wrote to the .log file but didn't echo to stdout, and gives a
        # single canonical place to find the failure reason in the job log.
        # No artifact upload — everything we need is in the live log.
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          logs=(build/precommit/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no gate logs to print"
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "::group::tail of $(basename "$log")"
            tail -500 "$log" || true
            echo "::endgroup::"
          done

      - name: upload logs (experiment — reintroducing to test Azure-path reliability)
        # Temporarily re-enabling upload-artifact to measure whether the
        # Azure blob proxy flakiness we saw earlier has settled. Live log
        # streaming above remains the primary channel; this is archival.
        # `timeout-minutes: 5` caps any stall so the job doesn't hostage
        # on a slow upload; `continue-on-error: true` keeps the job green
        # even if the upload times out.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: precommit-logs-${{ env.OP }}-${{ env.SOC }}-${{ github.run_attempt }}
          path: build/precommit/
          if-no-files-found: ignore
          retention-days: 14
