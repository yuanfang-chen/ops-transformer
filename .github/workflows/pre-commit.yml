name: pre-commit

# Iteration loop on the self-hosted yf2 runner (Ascend 910B4, aarch64, CANN 9.0.0.beta2).
# Manual only: trigger via `gh workflow run pre-commit.yml --ref <branch>` with the
# inputs below. Push / PR triggers were removed intentionally — the runner is a
# single self-hosted box and we don't want every branch push to queue on it.

on:
  workflow_dispatch:
    inputs:
      op:
        description: Operator name (see <family>/<op> or experimental/<class>/<op>)
        required: false
        default: fused_infer_attention_score
        type: string
      soc:
        description: SoC target
        required: false
        default: ascend910b
        type: choice
        options:
          - ascend910b
          - ascend950
      gates:
        description: "Gates to run (subset of: compile,ut,pytest,st). Empty = all."
        required: false
        default: compile,ut
        type: string
      strict:
        description: Treat SKIPs as failures
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # `bash -l` so /etc/profile sources the CANN set_env.sh that the devcontainer
    # Dockerfile appends. Every step gets ASCEND_HOME_PATH, LD_LIBRARY_PATH, etc.
    shell: bash -el {0}

jobs:
  pre-commit:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 240
    env:
      OP: ${{ inputs.op || 'fused_infer_attention_score' }}
      SOC: ${{ inputs.soc || 'ascend910b' }}
      GATES: ${{ inputs.gates || 'compile,ut' }}
      STRICT_FLAG: ${{ inputs.strict && '--strict' || '' }}
      JOBS: '64'
      FORCE_COLOR: '1'
      # Point Node-based actions (checkout, upload-artifact, etc.) at the
      # system CA bundle so they trust the corporate TLS-intercepting proxy.
      # Does NOT affect the runner agent's own step-log uploads — those go
      # through .NET and use the OS trust store directly.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ensure build deps
        # Mirrors the devcontainer Dockerfile's apt list. apt-get is a no-op
        # when packages are already present, so this is cheap on re-runs.
        run: |
          set -eu
          SUDO=$([ "$(id -u)" = "0" ] || echo sudo)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            gawk ninja-build cmake build-essential \
            libnuma-dev libsqlite3-dev jq
          gawk --version | head -1
          ninja --version

      - name: normalize gates
        # Empty GATES means "all"; expand to the full set so the per-gate
        # `if: contains(...)` checks below are exact-token matches.
        run: |
          g="${GATES}"
          [ -z "$g" ] && g=compile,ut,pytest,st
          echo "GATES_NORM=$g" >> "$GITHUB_ENV"

      - name: show environment
        run: |
          uname -a
          echo "cores: $(nproc)"
          echo "op=${OP}  soc=${SOC}  gates=${GATES_NORM}  strict=${STRICT_FLAG:-(off)}"
          echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH:-unset}"
          python3 --version
          ccache --version | head -1 || true

      # One step per gate so each gate's log is readable via the GH API the
      # moment that gate finishes — the old single-step design kept every
      # gate's output hidden until the whole script exited.
      #
      # Each gate runs under `stdbuf -oL -eL` so the LD_PRELOAD it installs
      # propagates to every descendant (bash → cmake → ninja → compilers),
      # forcing line-buffered stdio instead of libc's default 4 KB block
      # buffering on pipes. Without this, output arrives in bursts and the
      # GH live log appears stalled mid-compile.
      - name: compile
        if: contains(format(',{0},', env.GATES_NORM), ',compile,')
        run: stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=compile ${STRICT_FLAG}

      - name: ut
        if: contains(format(',{0},', env.GATES_NORM), ',ut,')
        run: stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=ut ${STRICT_FLAG}

      - name: pytest
        if: contains(format(',{0},', env.GATES_NORM), ',pytest,')
        run: stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=pytest ${STRICT_FLAG}

      - name: st
        if: contains(format(',{0},', env.GATES_NORM), ',st,')
        run: stdbuf -oL -eL scripts/pre_commit_check.py "${SOC}" --op="${OP}" --only=st ${STRICT_FLAG}

      - name: publish logs to gist
        # Uploads build/precommit/*.log to a fresh gist using the runner's
        # on-disk gh auth (~/.config/gh/hosts.yml). Bypasses the Azure blob
        # path that the TLS-intercepting proxy breaks, so we get readable
        # logs even when GH Actions' own step-log upload drops chunks.
        if: always()
        continue-on-error: true
        run: |
          set -eu
          # Actions auto-injects GITHUB_TOKEN into every step; it does NOT
          # have gist:write and would 403. Clear it so gh falls back to the
          # runner's on-disk auth, which does have gist scope.
          unset GITHUB_TOKEN GH_TOKEN
          shopt -s nullglob
          logs=(build/precommit/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no gate logs under build/precommit/ — nothing to upload"
            exit 0
          fi
          # Strip ANSI colour codes so the gist renders cleanly.
          sanitized=()
          for f in "${logs[@]}"; do
            out="${f%.log}.txt"
            sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$f" > "$out"
            sanitized+=("$out")
          done
          title="${{ github.workflow }} ${OP}/${SOC} run ${{ github.run_id }}"
          url=$(gh gist create --desc "$title" "${sanitized[@]}")
          echo "gist: $url"
          echo "::notice title=Logs gist::$url"
          {
            echo "### Logs"
            echo "- [$title]($url)"
            for f in "${sanitized[@]}"; do
              echo "  - $(basename "$f") — $(wc -l < "$f") lines"
            done
          } >> "$GITHUB_STEP_SUMMARY"
