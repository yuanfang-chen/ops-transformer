name: quickstart-e2e

# End-to-end sanity check that mirrors docs/QUICKSTART.md Section 1:
# build the add_example operator, install the .run package, run the
# example binary, and verify the output. Useful after CANN upgrades,
# runner rebuilds, or toolchain changes to confirm the basic pipeline
# still works.
#
# Uses the same gateway → real-runner topology as pre-commit.yml.

on:
  workflow_dispatch:
    inputs:
      soc:
        description: SoC target
        required: false
        default: ascend950
        type: choice
        options:
          - ascend910b
          - ascend950
      jobs:
        description: Parallel jobs (-jN) for the build
        required: false
        default: '32'
        type: string
      operator:
        description: Operator to build and run
        required: false
        default: add_example
        type: string
      runner:
        description: |
          Specific gateway runner label. To target one physical runner,
          give that runner a unique label, often matching its runner name.
        required: true
        default: 'zta5'
        type: string

concurrency:
  group: runner-singleton-${{ inputs.runner }}
  cancel-in-progress: false

defaults:
  run:
    shell: stdbuf -oL -eL bash -el {0}

jobs:
  quickstart:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      OPERATOR: ${{ inputs.operator }}
      SOC: ${{ inputs.soc }}
      JOBS: ${{ inputs.jobs }}
      FORCE_COLOR: '1'
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: sync real runner to test SHA
        run: |
          source ~/test_runner.bash
          for attempt in 1 2 3 4 5; do
            if ghrunner git fetch --force --prune origin "${GITHUB_REF}"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "git fetch failed after 5 attempts"
              exit 1
            fi
            base=$((5 * (2 ** (attempt - 1))))
            jitter=$((RANDOM % base))
            delay=$((base + jitter))
            echo "git fetch failed (attempt $attempt); sleeping ${delay}s before retry"
            sleep "$delay"
          done
          ghrunner git reset --hard "${GITHUB_SHA}"
          ghrunner git log -1 --oneline

      - name: show environment
        run: |
          source ~/test_runner.bash
          echo "operator=${OPERATOR}  soc=${SOC}  jobs=${JOBS}"
          echo "--- gateway ---"
          uname -a
          echo "--- real runner ---"
          ghrunner bash -lc 'uname -a; echo "cores: $(nproc)"; echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH:-unset}"; python3 --version; ccache --version | head -1 || true'

      # QUICKSTART step 2: build the operator package
      - name: build ${{ inputs.operator }}
        run: |
          source ~/test_runner.bash
          ghrunner env JOBS="${JOBS}" FORCE_COLOR="${FORCE_COLOR}" \
            bash build.sh --pkg --soc="${SOC}" --ops="${OPERATOR}" -j"${JOBS}"

      # QUICKSTART step 3: install the .run package
      - name: install run package
        run: |
          source ~/test_runner.bash
          pkg=$(ghrunner bash -c 'ls -1t build_out/cann-ops-transformer-*.run 2>/dev/null | head -1' | tr -d '\r\n')
          if [ -z "$pkg" ]; then
            echo "no .run pkg under build_out/ — build step failed?"
            exit 1
          fi
          echo "installing $pkg"
          ghrunner chmod +x "$pkg"
          ghrunner "$pkg" --quiet

      # QUICKSTART steps 4+5: set LD_LIBRARY_PATH and run the example
      - name: run ${{ inputs.operator }} and verify output
        run: |
          source ~/test_runner.bash
          CANN=$(ghrunner bash -c 'echo "${ASCEND_HOME_PATH}"' | tr -d '\r\n')
          EXAMPLE_LD="${CANN}/opp/vendors/custom_transformer/op_api/lib"

          output=$(ghrunner env LD_LIBRARY_PATH="${EXAMPLE_LD}:${CANN}/lib64" FORCE_COLOR="${FORCE_COLOR}" \
            bash build.sh --run_example "${OPERATOR}" eager cust --vendor_name=custom 2>&1) || true
          printf '%s\n' "$output"

          if [ "${OPERATOR}" != "add_example" ]; then
            echo ""
            echo "quickstart smoke test completed for ${OPERATOR}; skipping add_example output assertion"
          elif echo "$output" | grep -q 'result\[0\] is: 2\.000000'; then
            echo ""
            echo "quickstart smoke test PASSED — add_example produced expected output"
          else
            echo ""
            echo "quickstart smoke test FAILED — expected 'result[0] is: 2.000000' in output"
            exit 1
          fi
