name: test-drive runner

# Smoke-tests the gateway → real-runner plumbing used by pre-commit.yml and
# batch.yml. Run this after changes to `test_runner` on the gateway, to the
# container's git remote / credentials, or to the fetch-back logic. Manual
# dispatch only — each step is a self-contained check and the job fails as
# soon as any one check fails.

on:
  workflow_dispatch:

concurrency:
  # Shared across batch.yml, pre-commit.yml, and test-drive.yml because all
  # three mutate the same container workspace via test_runner. Queue serially
  # rather than risk a `git reset --hard` from one run yanking the tree out
  # from under another. Never cancel mid-run — a long batch should not be
  # killed by a quick pre-commit dispatch.
  group: runner-singleton
  cancel-in-progress: false

defaults:
  run:
    shell: bash -el {0}

jobs:
  test-drive:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      # No actions/checkout — every step operates either on ~/$HOME of the
      # gateway (test_runner.bash, ~/.huawei_pw) or on the container's
      # workspace via test_runner. Skipping checkout avoids the gateway's
      # flaky gnutls TLS handshake against github.com.

      - name: gateway preflight
        # Confirm the gateway has the pieces the real workflows rely on:
        #   - test_runner function in ~/.bashrc
        #   - sshpass + ~/.huawei_pw (used by the direct-ssh fetch-back path)
        run: |
          source ~/test_runner.bash
          echo "--- gateway: id ---"
          id
          echo "--- gateway: test_runner defined? ---"
          if declare -f test_runner > /dev/null; then
            echo "OK"
          else
            echo "MISSING — check ~/.bashrc on the gateway runner"
            exit 1
          fi
          echo "--- gateway: sshpass + pw file ---"
          command -v sshpass
          if [ -r ~/.huawei_pw ]; then
            echo "~/.huawei_pw: readable"
          else
            echo "~/.huawei_pw: missing or unreadable"
            exit 1
          fi

      - name: test_runner round-trip
        # Trivial call — if this hangs, ssh/docker auth is broken.
        run: |
          source ~/test_runner.bash
          test_runner bash -lc 'echo "container hostname: $(hostname)"; uname -a; pwd; id'

      - name: env var forwarding
        # Confirms `test_runner env VAR=val …` propagates a var into the
        # remote process's environment — same shape pre-commit.yml / batch.yml
        # use to pass JOBS and FORCE_COLOR into pre_commit_check.py. Uses
        # `printenv VAR` (reads getenv directly) instead of a shell expansion
        # like `bash -c 'echo "$VAR"'`, because test_runner's %q-based escaping
        # doesn't preserve a literal $ across the two dquote layers; the real
        # workflows only invoke binaries downstream of env, not shells.
        run: |
          source ~/test_runner.bash
          got=$(test_runner env CI_TEST_VAR=hello_world printenv CI_TEST_VAR | tr -d '\r\n')
          echo "got: [${got}]"
          if [ "$got" != "hello_world" ]; then
            echo "env forwarding broken"
            exit 1
          fi

      - name: container workspace is a git clone of this repo
        run: |
          source ~/test_runner.bash
          echo "--- toplevel ---"
          test_runner git -C /workspace/Src/ops-transformer rev-parse --show-toplevel
          echo "--- remotes ---"
          test_runner git -C /workspace/Src/ops-transformer remote -v

      - name: prepare container TLS trust
        # Bundle install is idempotent. Git config bits (HTTP/1.1 pin,
        # larger post-buffer, faster stall detection) are cheap to re-apply
        # and we always set them. See pre-commit.yml for full rationale.
        run: |
          source ~/test_runner.bash
          if test_runner bash -c "openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -q 'Huawei Web Secure'"; then
            echo "container TLS trust already includes Huawei CA — skipping bundle install"
          else
            echo "installing Huawei CA into container bundle"
            test_runner update-ca-certificates --fresh
            test_runner git config --system http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi
          test_runner git config --system http.postBuffer 524288000
          test_runner git config --system http.lowSpeedLimit 1000
          test_runner git config --system http.lowSpeedTime 30
          echo "done"

      - name: sync container to dispatched SHA
        # Exercises the same fetch + reset that the real workflows do before
        # running gates. Verifies container HEAD lands on GITHUB_SHA after.
        run: |
          source ~/test_runner.bash
          test_runner git fetch --force --prune origin "${GITHUB_REF}"
          test_runner git reset --hard "${GITHUB_SHA}"
          got=$(test_runner git rev-parse HEAD | tr -d '\r\n')
          echo "container HEAD: [${got}]"
          echo "dispatched SHA: [${GITHUB_SHA}]"
          if [ "$got" != "${GITHUB_SHA}" ]; then
            echo "sync failed — container HEAD does not match dispatched SHA"
            exit 1
          fi

      - name: fetch-back via direct sshpass (binary integrity)
        # Writes a 64 KiB random fixture inside the container, pulls the
        # build/precommit/ tree back over the no-PTY sshpass path the real
        # workflows use for logs, and verifies sha256 survives the transfer.
        run: |
          source ~/test_runner.bash
          # Fixture on the container side.
          test_runner bash -c 'mkdir -p build/precommit && dd if=/dev/urandom of=build/precommit/fixture.bin bs=1024 count=64 status=none && sha256sum build/precommit/fixture.bin > build/precommit/fixture.sha256'
          expected=$(test_runner cat build/precommit/fixture.sha256 | awk '{print $1}' | tr -d '\r\n')
          echo "expected sha256: [${expected}]"

          # Pull via direct ssh (no -t) + docker exec (no -it) so the tar
          # stream is not mangled by PTY newline cooking.
          rm -rf build/precommit && mkdir -p build/precommit
          sshpass -f ~/.huawei_pw ssh -o StrictHostKeyChecking=no A2 \
            'docker exec -w /workspace/Src/ops-transformer cann_container tar -C build/precommit -cf - . 2>/dev/null' \
            | tar -C build/precommit -xf -

          echo "--- local build/precommit/ after fetch ---"
          ls -la build/precommit/
          got=$(sha256sum build/precommit/fixture.bin | awk '{print $1}')
          echo "got sha256:      [${got}]"
          if [ "$got" != "$expected" ]; then
            echo "fetch-back corrupted binary — transfer is NOT clean"
            exit 1
          fi

      - name: cleanup fixture on container
        if: always()
        continue-on-error: true
        run: |
          source ~/test_runner.bash
          test_runner rm -f build/precommit/fixture.bin build/precommit/fixture.sha256

      - name: summary
        run: echo "All runner preflight checks passed."
