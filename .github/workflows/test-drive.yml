name: test-drive runner

# Smoke-tests the gateway → real-runner plumbing used by pre-commit.yml and
# batch.yml. Run after changes to any `<runner-label>runner` function on a
# gateway, to the container's git remote / credentials, or to the fetch-back
# logic. Manual dispatch only — each step is a self-contained check and the
# job fails as soon as any one check fails. Pick which runner to test via
# the `runner` input (default a2).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to smoke-test. Default a2.
        required: false
        default: a2
        type: string

concurrency:
  # Per-runner singleton so it doesn't queue behind unrelated work.
  group: runner-singleton-${{ inputs.runner }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -el {0}

jobs:
  test-drive:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner }}"]
    timeout-minutes: 10
    env:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      # Reach-function name follows the convention: <runner-label>runner
      RUNNER_FN: ${{ format('{0}runner', inputs.runner) }}
    steps:
      # No actions/checkout — every step operates either on ~/$HOME of the
      # gateway (test_runner.bash, ~/.huawei_pw) or on the container's
      # workspace via $RUNNER_FN. Skipping checkout avoids the gateway's
      # flaky gnutls TLS handshake against github.com.

      - name: gateway preflight
        # Confirm the gateway has the pieces the real workflows rely on:
        #   - $RUNNER_FN function in ~/test_runner.bash
        #   - sshpass + ~/.huawei_pw (used by the direct-ssh fetch-back path)
        run: |
          source ~/test_runner.bash
          echo "--- gateway: id ---"
          id
          echo "--- gateway: ${RUNNER_FN} defined? ---"
          if declare -f "${RUNNER_FN}" > /dev/null; then
            echo "OK"
          else
            echo "MISSING — check ~/test_runner.bash on the gateway runner"
            exit 1
          fi
          echo "--- gateway: sshpass + pw file ---"
          command -v sshpass
          if [ -r ~/.huawei_pw ]; then
            echo "~/.huawei_pw: readable"
          else
            echo "~/.huawei_pw: missing or unreadable"
            exit 1
          fi

      - name: runner round-trip
        # Trivial call — if this hangs, ssh/docker auth is broken.
        run: |
          source ~/test_runner.bash
          "${RUNNER_FN}" bash -lc 'echo "container hostname: $(hostname)"; uname -a; pwd; id'

      - name: env var forwarding
        # Confirms `$RUNNER_FN env VAR=val …` propagates a var into the
        # remote process's environment — same shape pre-commit.yml / batch.yml
        # use to pass JOBS and FORCE_COLOR into pre_commit_check.py. Uses
        # `printenv VAR` (reads getenv directly) instead of a shell expansion
        # like `bash -c 'echo "$VAR"'`, because the runner function's %q-based escaping
        # doesn't preserve a literal $ across the two dquote layers; the real
        # workflows only invoke binaries downstream of env, not shells.
        run: |
          source ~/test_runner.bash
          got=$("${RUNNER_FN}" env CI_TEST_VAR=hello_world printenv CI_TEST_VAR | tr -d '\r\n')
          echo "got: [${got}]"
          if [ "$got" != "hello_world" ]; then
            echo "env forwarding broken"
            exit 1
          fi

      - name: container workspace is a git clone of this repo
        # Don't hardcode the workspace path — it varies per runner (each
        # `<label>runner` function `docker exec -w …` cd's into its own
        # path). Run git in the runner's default cwd and rely on
        # `--show-toplevel` to confirm we're inside a git tree.
        run: |
          source ~/test_runner.bash
          echo "--- toplevel ---"
          "${RUNNER_FN}" git rev-parse --show-toplevel
          echo "--- remotes ---"
          "${RUNNER_FN}" git remote -v

      - name: prepare container TLS trust
        # Bundle install is idempotent. Git config bits (HTTP/1.1 pin,
        # larger post-buffer, faster stall detection) are cheap to re-apply
        # and we always set them. See pre-commit.yml for full rationale.
        run: |
          source ~/test_runner.bash
          if "${RUNNER_FN}" bash -c "openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null | grep -q 'Huawei Web Secure'"; then
            echo "container TLS trust already includes Huawei CA — skipping bundle install"
          else
            echo "installing Huawei CA into container bundle"
            "${RUNNER_FN}" update-ca-certificates --fresh
            "${RUNNER_FN}" git config --system http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          fi
          "${RUNNER_FN}" git config --system http.postBuffer 524288000
          "${RUNNER_FN}" git config --system http.lowSpeedLimit 1000
          "${RUNNER_FN}" git config --system http.lowSpeedTime 30
          echo "done"

      - name: sync container to dispatched SHA
        # Exercises the same fetch + reset that the real workflows do before
        # running gates. 5-try exponential+jitter retry on git fetch because
        # the corp proxy flakes intermittently — see pre-commit.yml.
        # Connection-level timeouts are the runner function's responsibility
        # (configure ssh `-o ConnectTimeout=… -o ServerAliveInterval=…
        # -o ServerAliveCountMax=…` inside the function). `--progress` and
        # `set -x` stream useful detail to the live job log while running.
        run: |
          set -x
          source ~/test_runner.bash
          for attempt in 1 2 3 4 5; do
            echo "[$(date +%T)] attempt $attempt: starting git fetch"
            if "${RUNNER_FN}" git fetch --progress --force --prune origin "${GITHUB_REF}"; then
              echo "[$(date +%T)] attempt $attempt: fetch OK"
              break
            fi
            echo "[$(date +%T)] attempt $attempt: fetch failed"
            if [ "$attempt" = "5" ]; then
              echo "git fetch failed after 5 attempts"
              exit 1
            fi
            base=$((5 * (2 ** (attempt - 1))))
            jitter=$((RANDOM % base))
            delay=$((base + jitter))
            echo "[$(date +%T)] sleeping ${delay}s before retry"
            sleep "$delay"
          done
          "${RUNNER_FN}" git reset --hard "${GITHUB_SHA}"
          got=$("${RUNNER_FN}" git rev-parse HEAD | tr -d '\r\n')
          echo "container HEAD: [${got}]"
          echo "dispatched SHA: [${GITHUB_SHA}]"
          if [ "$got" != "${GITHUB_SHA}" ]; then
            echo "sync failed — container HEAD does not match dispatched SHA"
            exit 1
          fi

      - name: fetch-back binary integrity
        # Writes a 64 KiB random fixture inside the container, pulls the
        # build/precommit/ tree back via `${RUNNER_FN} tar` (same path the
        # real workflows use for logs — no PTY in the command form, so
        # binary stays clean), and verifies sha256 survives the transfer.
        # Connection-level timeouts are the runner function's responsibility.
        run: |
          set -x
          source ~/test_runner.bash
          # Fixture on the container side.
          "${RUNNER_FN}" bash -c 'mkdir -p build/precommit && dd if=/dev/urandom of=build/precommit/fixture.bin bs=1024 count=64 status=none && sha256sum build/precommit/fixture.bin > build/precommit/fixture.sha256'
          expected=$("${RUNNER_FN}" cat build/precommit/fixture.sha256 | awk '{print $1}' | tr -d '\r\n')
          echo "expected sha256: [${expected}]"

          rm -rf build/precommit && mkdir -p build/precommit
          "${RUNNER_FN}" tar -C build/precommit -cf - . 2>/dev/null \
            | tar -C build/precommit -xf -

          echo "--- local build/precommit/ after fetch ---"
          ls -la build/precommit/
          got=$(sha256sum build/precommit/fixture.bin | awk '{print $1}')
          echo "got sha256:      [${got}]"
          if [ "$got" != "$expected" ]; then
            echo "fetch-back corrupted binary — transfer is NOT clean"
            exit 1
          fi

      - name: cleanup fixture on container
        if: always()
        continue-on-error: true
        run: |
          source ~/test_runner.bash
          "${RUNNER_FN}" rm -f build/precommit/fixture.bin build/precommit/fixture.sha256

      - name: summary
        run: echo "All runner preflight checks passed."
