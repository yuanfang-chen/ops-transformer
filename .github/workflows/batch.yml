name: batch

# Manual batch iteration: run pre_commit_check.py across a cartesian product of
# ops and SoCs in a single job. Kept as a bash loop (rather than a job matrix)
# because yf2 is a single self-hosted runner — parallel jobs would just queue.
# Gates default to compile,ut; override via the `gates` input for heavier runs.

on:
  workflow_dispatch:
    inputs:
      ops:
        description: Space-separated op names
        required: true
        default: fused_infer_attention_score
        type: string
      socs:
        description: Space-separated SoCs (ascend910b / ascend950)
        required: true
        default: ascend910b
        type: string
      gates:
        description: "Gates to run (subset of: compile,ut,pytest,st). Empty = all."
        required: false
        default: compile,ut
        type: string
      strict:
        description: Treat SKIPs as failures
        required: false
        default: false
        type: boolean
      fail_fast:
        description: Stop at first failing (op, soc); if off, run all and report
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -el {0}

jobs:
  batch:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 480
    env:
      OPS: ${{ inputs.ops }}
      SOCS: ${{ inputs.socs }}
      GATES: ${{ inputs.gates }}
      STRICT_FLAG: ${{ inputs.strict && '--strict' || '' }}
      FAIL_FAST: ${{ inputs.fail_fast }}
      JOBS: '64'
      FORCE_COLOR: '1'
    steps:
      # No actions/checkout — all work runs on the container via test_runner
      # (scripts live at /workspace/Src/ops-transformer inside the container).
      # Nothing here references $GITHUB_WORKSPACE. Skipping checkout dodges
      # the gateway's flaky gnutls TLS handshake against github.com.

      - name: sync real runner to test SHA
        # The container's workspace (/workspace/Src/ops-transformer) is an
        # independent git clone, not a bind-mount of the gateway's checkout.
        # Fetch the exact commit under CI from origin (GitHub) and hard-reset
        # to it so gates run against the PR's code, not whatever stale state
        # the container happens to be in. Untracked files (build/, ccache)
        # are preserved so incremental builds stay warm.
        run: |
          source ~/test_runner.bash
          test_runner git fetch --force --prune origin "${GITHUB_REF}"
          test_runner git reset --hard "${GITHUB_SHA}"
          test_runner git log -1 --oneline

      - name: iterate (op × soc)
        # The gateway runner only orchestrates; builds run on the real runner
        # (docker container on a remote ssh host) via the `test_runner` bash
        # function, which lives in ~/test_runner.bash on the gateway.
        run: |
          source ~/test_runner.bash
          set -u
          failed=()
          passed=()
          for soc in ${SOCS}; do
            for op in ${OPS}; do
              echo "::group::${op} on ${soc}"
              if test_runner env JOBS="${JOBS}" FORCE_COLOR="${FORCE_COLOR}" scripts/pre_commit_check.py "${soc}" --op="${op}" --only="${GATES}" ${STRICT_FLAG}; then
                passed+=("${op}/${soc}")
                echo "::endgroup::"
              else
                failed+=("${op}/${soc}")
                echo "::endgroup::"
                if [ "${FAIL_FAST}" = "true" ]; then
                  break 2
                fi
              fi
            done
          done
          echo
          echo "passed (${#passed[@]}): ${passed[*]:-(none)}"
          echo "failed (${#failed[@]}): ${failed[*]:-(none)}"
          [ ${#failed[@]} -eq 0 ]

      - name: fetch logs from real runner
        # Gates write logs under build/precommit on the container; pull them
        # back via test_runner. The command form of test_runner no longer
        # allocates a PTY, so binary tar output passes through cleanly.
        if: always()
        continue-on-error: true
        run: |
          source ~/test_runner.bash
          mkdir -p build/precommit
          test_runner tar -C build/precommit -cf - . 2>/dev/null \
            | tar -C build/precommit -xf - || true
          ls -la build/precommit/ || true

      - name: upload logs
        if: always()
        continue-on-error: true
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
        uses: actions/upload-artifact@v4
        with:
          name: batch-logs-${{ github.run_attempt }}
          path: build/precommit/
          if-no-files-found: ignore
          retention-days: 14
