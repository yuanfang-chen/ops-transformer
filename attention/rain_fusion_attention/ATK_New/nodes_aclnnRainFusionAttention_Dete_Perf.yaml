nodes:
   - backend: pyaclnn #pyaclnn执行性能任务采集各个用例性能耗时数据
     task: ['performance_device']
     name: "perf_npu"
     devices: [0]
     run_modes: ['ascend_use_deterministic_algorithms']
   - backend: cpu #执行cpu标杆，跑出符合shape要求的aclnn输出tensor，并作为入参传入aclnn接口，is_compare置于false，不参与精度比对
     task: ['accuracy']
     name: "perf_cpu"
     is_compare: 'False'
   - backend: pyaclnn #该处节点不执行，仅读取bm_file所给路径表格内的数据并与主节点执行结果作比
     task: ['performance_device']
     bm_file: "/autotest/ATK_CIDA/ascend/Aclnn/Transformer_Inference/aclnnRainFusionAttention/aclnnRainFusionAttention_Dete_Perf.xlsx"
     devices: [0]